# Generated from the Terraform output "ansible_inventory" (terraform output -raw ansible_inventory).
# Office servers without a public address are reached through cloud-edge (jump host).

[office_gateway]
onprem-gw ansible_host=3.65.238.247

[cloud_gateway]
cloud-edge ansible_host=35.157.144.233

[office_servers]
onprem-srv ansible_host=10.10.1.10 ansible_ssh_common_args='-o ProxyJump=ubuntu@35.157.144.233'

[monitoring]
monitoring-server ansible_host=monitoring.innovatech.internal ansible_ssh_common_args='-o ProxyJump=ubuntu@35.157.144.233'

[gateways:children]
office_gateway
cloud_gateway

[agents:children]
gateways
office_servers
