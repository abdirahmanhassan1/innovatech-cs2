# Rollback of the SOAR: points the "prod" alias of each function back to the version it
# used before the last release. Started by hand, and needs approval like a release.
name: soar-rollback

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: soar-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AWS_REGION: eu-central-1
  FUNCTIONS: ingest processor cleanup

jobs:
  rollback:
    runs-on: [self-hosted, innovatech]
    environment: production
    steps:
      # The runner is my laptop, so the tools are checked first. A missing tool stops the
      # job before it changes anything.
      - name: Check the tools on the runner
        run: |
          for tool in aws; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is not installed on the runner"; exit 1; }
          done

      - name: AWS credentials (release role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/innovatech-github-release
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: soar-rollback-${{ github.run_id }}

      - name: Point prod back to the previous version
        run: |
          {
            echo "### Rollback"
            echo "| Function | From version | To version |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in $FUNCTIONS; do
            name="innovatech-soar-$f"
            current=$(aws lambda get-alias --function-name "$name" --name prod --query FunctionVersion --output text)
            description=$(aws lambda get-alias --function-name "$name" --name prod --query Description --output text)
            previous="${description#previous=}"
            if [ "$previous" = "$description" ] || [ -z "$previous" ]; then
              echo "$name: no previous version recorded, left on version $current"
              echo "| $name | $current | unchanged |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            aws lambda update-alias --function-name "$name" --name prod --function-version "$previous" \
              --description "previous=$current" --query FunctionVersion --output text
            echo "| $name | $current | $previous |" >> "$GITHUB_STEP_SUMMARY"
          done
