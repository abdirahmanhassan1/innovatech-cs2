# Prometheus configuration of the monitoring server.
# Every host runs node_exporter on port 9100. Office hosts are reached through the VPN.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["onprem-gw.innovatech.internal:9100"]
        labels: { host: onprem-gw, site: office, role: gateway }
      - targets: ["onprem-srv.innovatech.internal:9100"]
        labels: { host: onprem-srv, site: office, role: server }
      - targets: ["cloud-edge.innovatech.internal:9100"]
        labels: { host: cloud-edge, site: cloud, role: gateway }
      - targets: ["localhost:9100"]
        labels: { host: monitoring, site: cloud, role: monitoring }

  - job_name: monitoring-stack
    static_configs:
      - targets: ["localhost:9090"]
        labels: { host: monitoring, service: prometheus }
      - targets: ["localhost:3100"]
        labels: { host: monitoring, service: loki }
      - targets: ["localhost:3000"]
        labels: { host: monitoring, service: grafana }
